name: Sauvegarde Supabase

on:
  schedule:
    - cron: '17 3 * * *'   # tous les jours à 03h17 UTC
  workflow_dispatch:        # bouton "Run workflow" pour la lancer à la main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Sécurité : la sauvegarde contient des données de joueurs. Elle est chiffrée avec BACKUP_PASSPHRASE,
      # donc elle reste illisible même si le dépôt est public.
      - name: Vérifier le mot de passe de chiffrement
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ] || [ ${#BACKUP_PASSPHRASE} -lt 12 ]; then
            echo "Ajoute le secret BACKUP_PASSPHRASE (au moins 12 caractères) dans Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Sauvegarder les tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/backup.js backup
      - name: Archiver et chiffrer
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -czf sauvegarde.tar.gz backup
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in sauvegarde.tar.gz -out "sauvegarde-$(date -u +%Y-%m-%d).tar.gz.enc"
          rm -rf backup sauvegarde.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-supabase-chiffree
          path: sauvegarde-*.tar.gz.enc
          retention-days: 90
