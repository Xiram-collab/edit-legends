name: Sauvegarde Supabase

on:
  schedule:
    - cron: '17 3 * * *'   # tous les jours à 03h17 UTC
  workflow_dispatch:        # bouton "Run workflow" pour la lancer à la main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Sécurité : la sauvegarde contient des données de joueurs. On refuse de la faire si le dépôt est public.
      - name: Vérifier que le dépôt est privé
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "Le dépôt est PUBLIC : passe-le en Privé (Settings > Danger Zone > Change visibility) avant d'activer la sauvegarde."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Sauvegarder les tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/backup.js backup
      - name: Archiver
        run: tar -czf "sauvegarde-$(date -u +%Y-%m-%d).tar.gz" backup
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-supabase
          path: sauvegarde-*.tar.gz
          retention-days: 90
